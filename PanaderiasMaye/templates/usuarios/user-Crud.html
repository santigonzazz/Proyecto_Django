{% extends 'base.html' %}
{% load static %}
{% block titulo %}Crud-User{% endblock %}



{% block body %}

{% if messages %}
    <div class="alert alert-success">
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
    </div>
{% endif %}
<main>
    <div class="container mt-5">
        <h1 class="title text-center">PERSONALIZACION DE CUENTA DE USUARIO</h1>
        <form action="{% url 'editar-perfil' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="editUser">
                <strong>
                    <h5>Nombre</h5>
                </strong>
                <input type="text" class="form-control" value="{{ request.session.auth.nombre }}" name="nombre" required 
                pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" title="Solo se permiten letras y espacios">
            </div>
            <div class="editUser">
                <strong>
                    <h5>Apellido</h5>
                </strong>
                <input type="text" class="form-control" value="{{ request.session.auth.apellido }}" name="apellido" required 
                pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" title="Solo se permiten letras y espacios">
            </div>
            <div class="editUser">
                <strong>
                    <h5>celular</h5>
                </strong>
                <input type="text" class="form-control" value="{{ request.session.auth.celular }}" name="celular" required pattern="[0-9]{10}" title="Debe contener 10 dígitos" autocomplete="tel">
            </div>
            <div class="editUser">
                <strong>
                    <h5>Correo</h5>
                </strong>
                <input type="text" class="form-control" value="{{ request.session.auth.email }}" name="email" readonly>
            </div>
            <div class="editUser"><button class="btn-ed">Actualizar</button></div>
        </form>

</main><br>



{% endblock %}
