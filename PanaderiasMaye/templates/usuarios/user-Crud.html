{% extends 'base.html' %}
{% load static %}
{% block titulo %}Crud-User{% endblock %}


{% block body %}
    <main>
        <div class="container mt-5">
            <h1 class="title text-center">PERSONALIZACION DE CUENTA DE USUARIO</h1>

            <div class="editUser"><h3>Tu foto</h3><div class="img-section"><div class="user-img"><img src="{% static 'img/logopan.png' %}" alt="Bakery Bread" class="img-user-crud" /></div><div class="btn-container-crud-user"><button class="btn-ed">quitar</button><button class="btn-ed">cambiar</button></div></div></div>
            <div class="editUser"><strong><h5>Nombre</h5></strong><input type="text" class="form-control" placeholder="@nombreDeUsuario"></div>
            <div class="editUser"><strong><h5>Apellido</h5></strong><input type="text" class="form-control" placeholder="@apellidoDeUsuario"></div>
            <div class="editUser"><strong><h5>celular</h5></strong><input type="text" class="form-control" placeholder="@celularDeUsuario"></div>
            <div class="editUser"><strong><h5>contraseña</h5></strong><input type="text" class="form-control" placeholder="@contraseñaDeUsuario"></div>
            <div class="editUser"><button class="btn-ed">Actualizar</button></div>

    </main><br>
  
 
    
{% endblock %}
