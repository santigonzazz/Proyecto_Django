{% extends 'base.html' %}
{% load static %}
{% block titulo %}Crud-User{% endblock %}



{% block body %}

{% if messages %}
    <div class="alert  {% if messages == success %} alert-success {% else %} alert-danger {% endif %} ">
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
    </div>
{% endif %}
<main>
    <div class="container mt-5">
        <h1 class="title text-center">PERSONALIZACIÓN DE CUENTA DE USUARIO</h1>
        <form action="{% url 'editar-perfil' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="editUser">
                <strong>
                    <h5>Nombre</h5>
                </strong>
                <input type="text" class="form-control" value="{{ request.session.auth.nombre }}" name="nombre"> 
            </div>
            <div class="editUser">
                <strong>
                    <h5>Apellido</h5>
                </strong>
                <input type="text" class="form-control" value="{{ request.session.auth.apellido }}" name="apellido">
            </div>
            <div class="editUser">
                <strong>
                    <h5>Celular</h5>
                </strong>
                <input type="text" class="form-control" value="{{ request.session.auth.celular }}" name="celular" autocomplete="tel">
            </div>
            <div class="editUser">
                <strong>
                    <h5>Correo</h5>
                </strong>
                <input type="text" class="form-control" value="{{ request.session.auth.email }}" name="email" readonly>
            </div>
            <div class="editUser"><button class="btn-ed">Actualizar</button></div>
        </form>

</main><br>



{% endblock %}
