

{% extends 'base2.html' %}
{% load static %}
{% block titulo %}Recuperar Contraseña {% endblock %}

{% block body %}
    <main>
        <div class="container">
            <div class="row align-items-center">
                <br>
                <div class="col-md-6 image-container">
                    <img src="{% static 'img/logopan.png' %}" alt="Bakery Bread" />
                </div>
                <div class="col-md-6">
                    <h1 class="title">Recupera Tú Clave</h1>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
                            <p>{{ message }}</p>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo:</label>
                            <input type="email" class="form-control" id="email" name="email" autocomplete="email">
                        </div>
                        <button type="submit" class="btn-login btn btn-primary">Enviar Código</button>
                    </form>

                </div>
            </div>
        </div>
    </main>
{% endblock %}
