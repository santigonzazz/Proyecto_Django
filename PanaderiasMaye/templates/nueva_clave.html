{% extends 'base2.html' %}
{% load static %}
{% block titulo %}Login{% endblock %}

{% block body %}
    <main>
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 image-container">
                    <img src="{% static 'img/logopan.png' %}" alt="Bakery Bread" />
                </div>
                <div class="col-md-6">
                    <h1 class="title">Cambia Tú Contraseña</h1>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                            <p>{{ message }}</p>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label">Nueva Contraseña:</label>
                            <input type="password" class="form-control" id="email" name="password" autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Confirmar Contraseña:</label>
                            <input type="password" class="form-control" id="password" name="confirmar" autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn-login btn btn-primary">Cambiar Contraseña</button>
                    </form>

                </div>
            </div>
        </div>
    </main>
{% endblock %}
