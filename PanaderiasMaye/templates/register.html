{% extends 'base2.html' %}
{% load static %}
{% block titulo %}Inicio{% endblock %}
{% block body %} 

<main>
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 image-container">
                <img src="{% static 'img/logopan.png' %}" alt="Bakery Bread" />
            </div>
            <div class="col-md-6">
                <h1 class="title">Regístrate</h1>
                <form action="" method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" name="nombre" id="nombre" autocomplete="given-name" required 
                        pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" title="Solo se permiten letras y espacios" autocomplete="family-name">
                    </div>
                    <div class="mb-3">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" class="form-control" name="apellido" id="apellido" required 
                        pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" title="Solo se permiten letras y espacios" autocomplete="family-name">
                    </div>
                    <div class="mb-3">
                        <label for="celular" class="form-label">Celular</label>
                        <input type="tel" class="form-control" id="celular" name="celular" required pattern="[0-9]{10}" title="Debe contener 10 dígitos" autocomplete="tel">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo</label>
                        <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirmar Contraseña</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirmar_password" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-register btn btn-primary">Regístrate</button>
                </form>
                <div class="op-login mt-3">
                    <p>¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="btn-login btn btn-link">Inicia sesión</a></p>
                </div>
            </div>
        </div>
    </div>

    {% if messages %}
        <div class="alert alert-danger">
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
</main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("form");
        form.addEventListener("submit", function (event) {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;
            if (password !== confirmPassword) {
                event.preventDefault();
                alert("Las contraseñas no coinciden.");
            }
        });
    });
</script>

{% endblock %}
