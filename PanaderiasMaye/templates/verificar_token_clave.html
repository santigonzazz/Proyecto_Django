
{% extends 'base2.html' %}
{% load static %}
{% block titulo %}Verificar Codigo {% endblock %}

{% block body %}
    <main>
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 image-container">
                    <img src="{% static 'img/logopan.png' %}" alt="Bakery Bread" />
                </div>
                <div class="col-md-6">
                    <h1 class="title">Verificación de Token</h1>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                            <p>{{ message }}</p>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label">Código Recibido:</label>
                            <input type="text" name="codigo" class="form-control" placeholder="Ingresa el código" required>
                        </div>
                       
                        <button type="submit" class="btn-login btn btn-primary">Verificar</button>
                    </form>

                   
                </div>
            </div>
        </div>
    </main>
{% endblock %}
